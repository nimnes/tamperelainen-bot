name: Tamperelainen news

on:
  workflow_dispatch:
    inputs:
        trigger:
            description: "What triggered this workflow"
            required: false
            default: "manual"
  # Cloudflare owns scheduling (Europe/Helsinki, including daylight saving):
  # Mon–Fri 07:30–21:30 hourly; Sat–Sun 09:00–22:00 hourly, inclusive.
  # Keep GitHub's schedule disabled to avoid duplicate executions.

permissions:
  contents: write

concurrency:
  group: tamperelainen-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show trigger
        run: |
              echo "Workflow trigger: ${{ inputs.trigger || 'manual' }}"

      - name: Restore article database
        env:
          GH_TOKEN: ${{ github.token }}
          DB_RELEASE_TAG: articles-db
        run: |
          mkdir -p data

          # The release asset is the persistent source of truth for articles.db.
          # If the release does not exist yet, keep the checked-out database as the
          # migration seed. This preserves the existing history on the first run.
          if gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Restoring articles.db from GitHub Release $DB_RELEASE_TAG"
            restore_dir=$(mktemp -d)
            if gh release download "$DB_RELEASE_TAG" \
              --pattern articles.db \
              --dir "$restore_dir"; then
              mv "$restore_dir/articles.db" data/articles.db
              echo "Restored articles.db from the release."
            elif [ -f data/articles.db ]; then
              echo "WARNING: The release database asset could not be downloaded; keeping the checked-out database as a recovery seed."
            else
              echo "WARNING: The release database asset could not be downloaded; the bot will create a new database."
            fi
            rm -rf "$restore_dir"
          elif [ -f data/articles.db ]; then
            echo "No database release exists yet; using the repository database as migration seed."
          else
            echo "No existing database found; the bot will create a new one."
          fi

      - name: Stop tracking article database
        run: |
          # .gitignore prevents future tracking, while this removes the file from
          # the repository index if older versions of the bot committed it.
          git rm --cached --ignore-unmatch data/articles.db

          if git diff --cached --quiet; then
            echo "articles.db is already untracked."
            exit 0
          fi

          git config user.name "tamperelainen-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stop tracking article database"
          git push

      - name: Run bot
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: google
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemma-4-31b-it' }}
          # This repository publishes Russian. The application default is English.
          OUTPUT_LANGUAGE: ru
        run: python -u bot.py --once

      - name: Persist article database to GitHub Release
        if: ${{ !cancelled() && steps.run_bot.outputs.new_articles != '' && steps.run_bot.outputs.new_articles != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DB_RELEASE_TAG: articles-db
        run: |
          if [ ! -f data/articles.db ]; then
            echo "ERROR: data/articles.db was not created."
            exit 1
          fi

          # A fixed release/tag is used as durable storage. The asset is replaced
          # atomically from the workflow's point of view and is not committed to Git.
          if gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing database release."
          else
            echo "Creating database release."
            gh release create "$DB_RELEASE_TAG" \
              --title "Persistent article database" \
              --notes "Persistent SQLite state for the Tamperelainen Telegram bot. This release asset is managed automatically by GitHub Actions."
          fi

          # GitHub can briefly return 404 for the old asset while --clobber is
          # replacing it. Retry with a fresh asset lookup before failing.
          for attempt in 1 2 3; do
            if gh release upload "$DB_RELEASE_TAG" data/articles.db --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not upload articles.db after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Upload attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "articles.db persisted to GitHub Release $DB_RELEASE_TAG."

      - name: Report article failures
        if: ${{ !cancelled() && steps.run_bot.outputs.failed_articles != '' && steps.run_bot.outputs.failed_articles != '0' }}
        env:
          FAILED_ARTICLES: ${{ steps.run_bot.outputs.failed_articles }}
          TEMPORARY_ARTICLES: ${{ steps.run_bot.outputs.temporary_articles }}
          DEFERRED_ARTICLES: ${{ steps.run_bot.outputs.deferred_articles }}
        run: |
          temporary=${TEMPORARY_ARTICLES:-0}
          if [ "$temporary" -gt 0 ]; then
            echo "::warning::$temporary article(s) could not be translated due to temporary provider failures. They remain eligible for retry while present in RSS."
          fi
          if [ "$FAILED_ARTICLES" -gt "$temporary" ]; then
            echo "::error::$((FAILED_ARTICLES - temporary)) article(s) failed unexpectedly; $DEFERRED_ARTICLES deferred."
            exit 1
          fi
