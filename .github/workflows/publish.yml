name: Tamperelainen news

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes during the daytime in Finland, avoiding 22:00-07:00 year-round.
    # GitHub Actions cron schedules are interpreted in UTC.
    - cron: "*/30 5-18 * * *"

permissions:
  contents: write

concurrency:
  group: tamperelainen-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gpt-oss:20b
          # This repository publishes Russian. The application default is English.
          OUTPUT_LANGUAGE: ru
        run: python bot.py --once

      - name: Save article database
        run: |
          if [ ! -f data/articles.db ]; then
            echo "No database file found; nothing to save."
            exit 0
          fi

          git config user.name "tamperelainen-bot"
          git config user.email "actions@users.noreply.github.com"

          # The database is intentionally persisted in Git even though *.db is ignored.
          git add -f data/articles.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "Update processed articles"
          git push
